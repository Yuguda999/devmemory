[project]
# PyPI distribution name (`devmemory` is taken by an unrelated project). The
# import package and the CLI command stay `devmemory` — see [tool.uv.build-backend].
name = "devmemory-ai"
version = "0.3.0"
description = "Universal Dev Memory — A persistent MCP server for cross-tool coding context"
readme = "README.md"
authors = [
    { name = "Yuguda Kolo", email = "elemenx93@gmail.com" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "memory", "context", "coding", "ai", "llm", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.0.0",
    "mcp>=1.0.0",
    # The MCP client talks to the REST API over HTTP — required at runtime.
    "httpx>=0.27.0",
]

[project.urls]
homepage = "https://devmemory.io"
repository = "https://github.com/Yuguda999/devmemory"
changelog = "https://github.com/Yuguda999/devmemory/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/Yuguda999/devmemory/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
postgres = [
    "asyncpg>=0.29.0",
]

[project.scripts]
devmemory = "devmemory.server:run"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Dist name is devmemory-ai but the import package + CLI command stay `devmemory`.
module-name = "devmemory"
module-root = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 flags function calls in argument defaults, but Depends()/Query()/Header()
# in defaults is exactly how FastAPI declares dependencies and params.
"src/devmemory/api/*.py" = ["B008"]
"src/devmemory/auth/middleware.py" = ["B008"]
# install.py is config data: long OS config-file paths and descriptive notes
# that can't be meaningfully shortened.
"src/devmemory/cli/install.py" = ["E501"]
# Hook scripts are standalone (run under the tool's own python3) and carry long
# single-line JSON log breadcrumbs that read worse when wrapped.
"src/devmemory/hooks/*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
